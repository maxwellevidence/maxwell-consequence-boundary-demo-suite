schema_version: "maxwell-demo-spec-v0.3.2"
suite_index: "05"
suite_name: "Maxwell Consequence Boundary Demo Suite"
demo_name: "Maxwell Incident Reconstruction Demo"
package_name: "maxwell-incident-reconstruction-demo"
version: "0.1.0"
python_package: "maxwell_incident_reconstruction"
threat_class: "Audit reconstruction / tamper detection"
headline: "The value is proving what happened later."
cold_open: "Three weeks after an AI-assisted incident workflow runs, an auditor asks why an action was allowed, reviewed, or blocked. Maxwell reconstructs the evidence snapshot, authority snapshot, policy receipt, timeline event, effect status, and tamper-detection result."
core_invariant: "Every proposed consequential AI action must leave a reconstructable record; effect records exist only when policy permits, and tampering is detected."
consequence_boundary: "Incident-response proposal to reconstructable action record"
primary_effect_artifact: "effect_record.json"
primary_no_effect_marker: "NO_EFFECT_CREATED.txt"
what_this_stresses: "Post-event proof, timeline reconstruction, manifest-bound artifacts, stale-policy review, and tamper detection."
audience:
  - "audit"
  - "legal"
  - "compliance"
  - "risk"
  - "insurance"
  - "board-level reviewers"
standard_commands:
  - "make demo"
  - "make verify"
  - "make reconstruct"
  - "make tamper-demo"
  - "make test"
  - "make package-check"
cases:
  - id: "01_permitted_action_effect_committed"
    attacks: "Baseline permitted action"
    expected: "allow"
  - id: "02_reviewed_action_needs_human"
    attacks: "High-risk action requiring human review"
    expected: "review"
  - id: "03_blocked_scope_violation"
    attacks: "Scope violation"
    expected: "block"
  - id: "04_attempted_action_missing_authority"
    attacks: "Missing authority"
    expected: "block"
  - id: "05_tamper_detection_lab_seed"
    attacks: "Seed case for tamper-detection lab"
    expected: "allow"
  - id: "06_stale_policy_context_requires_review"
    attacks: "Stale policy context"
    expected: "review"
public_boundaries:
  - "synthetic local inputs only"
  - "no real downstream execution"
  - "not production deployment"
  - "not legal, audit, compliance, privacy, or certification advice"
  - "not a disclosure of private Maxwell implementation details"
