name: demo-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Demo
        run: make demo
      - name: Verify
        run: make verify
      - name: Test
        run: make test
      - name: Package hygiene
        run: make package-check

      - name: Run adversarial corpus
        run: make adversarial
