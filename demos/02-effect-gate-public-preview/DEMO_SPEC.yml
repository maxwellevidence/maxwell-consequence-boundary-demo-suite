schema_version: "maxwell-demo-spec-v0.3.2"
suite_index: "02"
suite_name: "Maxwell Consequence Boundary Demo Suite"
demo_name: "Maxwell Effect Gate Public Preview"
package_name: "maxwell-effect-gate-public-preview"
version: "0.3.0"
python_package: "maxwell_effect_gate"
threat_class: "Technical review / signed authority / manifest verification"
headline: "No policy-derived allow, no effect record."
cold_open: "A skeptical reviewer asks whether the gate actually fails closed. This flagship demo exposes the deeper review surface: policy reason codes, authority-context validation, OIDC fixture tokens, signed manifests, artifact verification, and adversarially shaped non-allow cases."
core_invariant: "No policy-derived allow -> no effect_record.json."
consequence_boundary: "AI-assisted incident-remediation proposal to change-control effect record"
primary_effect_artifact: "effect_record.json"
primary_no_effect_marker: "absence of effect_record.json for non-allow outcomes"
what_this_stresses: "Technical reviewer credibility: deterministic policy decisions, OIDC authority context, manifest verification, tamper resistance, and explicit public-preview limits."
audience:
  - "developers"
  - "technical reviewers"
  - "AI governance reviewers"
  - "security reviewers"
  - "compliance reviewers"
standard_commands:
  - "make lint"
  - "make demo"
  - "make verify"
  - "make samples"
  - "make test"
  - "make package-check"
cases:
  - id: "staging_low_risk_dual_control"
    attacks: "Baseline bounded staging change with dual control"
    expected: "allow"
  - id: "staging_missing_dual_control"
    attacks: "Human approval missing"
    expected: "pause"
  - id: "production_critical_no_dual_control"
    attacks: "Production critical change without dual control"
    expected: "block"
  - id: "expired_authority"
    attacks: "Expired authority context"
    expected: "block"
  - id: "self_approval"
    attacks: "Self-approval attempt"
    expected: "block"
  - id: "malformed_evidence_missing_field"
    attacks: "Malformed public input shape"
    expected: "block"
  - id: "oidc_signed_token"
    attacks: "Valid signed OIDC authority fixture"
    expected: "allow"
  - id: "oidc_bad_token_wrong_audience"
    attacks: "OIDC wrong audience"
    expected: "block"
  - id: "oidc_bad_token_bad_signature"
    attacks: "OIDC bad signature"
    expected: "block"
  - id: "oidc_bad_token_expired"
    attacks: "OIDC expired token"
    expected: "block"
  - id: "oidc_bad_token_missing_scope"
    attacks: "OIDC missing required scope"
    expected: "block"
public_boundaries:
  - "synthetic local inputs only"
  - "no real downstream execution"
  - "not production deployment"
  - "not legal, audit, compliance, privacy, or certification advice"
  - "not a disclosure of private Maxwell implementation details"
