schema_version: "maxwell-demo-spec-v0.3.2"
suite_index: "01"
suite_name: "Maxwell Consequence Boundary Demo Suite"
demo_name: "Maxwell Effect Gate Basic Demo"
package_name: "maxwell-effect-gate-basic-demo"
version: "0.1.0"
python_package: "maxwell_effect_gate_basic"
threat_class: "Generic downstream effect control"
headline: "Evidence before effect."
cold_open: "A fictional AI workflow says an action is ready to proceed. Maxwell treats that output as a proposal, not authority, and creates a downstream effect record only when evidence, authority, scope, and policy all line up."
core_invariant: "No sufficient evidence + authority -> no downstream effect record."
consequence_boundary: "Generic proposed AI action to downstream effect-record creation"
primary_effect_artifact: "effect_record.json"
primary_no_effect_marker: "NO_EFFECT_CREATED.txt"
what_this_stresses: "The smallest public-safe proof that proposed AI action and authorized downstream effect are separate events."
audience:
  - "general reviewers"
  - "developers"
  - "enterprise AI teams"
  - "governance reviewers"
standard_commands:
  - "make demo"
  - "make verify"
  - "make test"
  - "make package-check"
cases:
  - id: "01_valid_low_risk_notice"
    attacks: "Baseline sufficient evidence and authority"
    expected: "EFFECT_COMMITTED"
  - id: "02_missing_evidence_refs"
    attacks: "Missing evidence references"
    expected: "REVIEW_ROUTED"
  - id: "03_missing_authority_context"
    attacks: "Missing authority context"
    expected: "REVIEW_ROUTED"
  - id: "04_scope_violation_suppressed"
    attacks: "Action outside authorized scope"
    expected: "EFFECT_SUPPRESSED"
  - id: "05_high_risk_requires_review"
    attacks: "High-risk action requiring review"
    expected: "REVIEW_ROUTED"
  - id: "06_prompt_injection_suppressed"
    attacks: "Prompt-injection instruction treated as evidence, not authority"
    expected: "EFFECT_SUPPRESSED"
public_boundaries:
  - "synthetic local inputs only"
  - "no real downstream execution"
  - "not production deployment"
  - "not legal, audit, compliance, privacy, or certification advice"
  - "not a disclosure of private Maxwell implementation details"
