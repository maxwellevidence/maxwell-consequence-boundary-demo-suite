name: suite-public-ci

on:
  push:
  pull_request:

jobs:
  suite-public-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shared demo development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML PyJWT cryptography ruff hypothesis
      - name: Install demos in editable mode
        run: |
          for d in demos/*; do
            echo "Installing $d"
            (cd "$d" && pip install --no-build-isolation -e ".[dev]")
          done
      - name: Run full suite public CI gate
        run: make ci-full
