schema_version: "maxwell-demo-spec-v0.3.2"
suite_index: "10"
suite_name: "Maxwell Consequence Boundary Demo Suite"
demo_name: "Maxwell Public Sector Determination Demo"
package_name: "maxwell-public-sector-determination-demo"
version: "0.1.0"
python_package: "maxwell_public_sector_determination"
threat_class: "Public-sector determination / due-process boundary"
headline: "Evidence before determination."
cold_open: "A synthetic public-sector workflow recommends granting or denying a benefit. Maxwell prevents the AI recommendation from binding the public system unless eligibility evidence, authority, notice, appeal-rights context, and required review are present."
core_invariant: "No valid evidence + authority + due-process context -> no public-sector determination effect record."
consequence_boundary: "AI eligibility recommendation to public-sector determination effect record"
primary_effect_artifact: "determination_effect_record.json"
primary_no_effect_marker: "NO_DETERMINATION_EFFECT_CREATED.txt"
what_this_stresses: "Adverse determination authority, missing documents, inconsistent records, notice, appeal rights, and due-process review."
audience:
  - "government"
  - "public sector"
  - "legal"
  - "policy"
  - "civic tech"
  - "regulated decision systems"
  - "development finance reviewers"
standard_commands:
  - "make demo"
  - "make verify"
  - "make test"
  - "make package-check"
cases:
  - id: "01_complete_eligibility_evidence"
    attacks: "Baseline complete eligibility evidence"
    expected: "commit"
  - id: "02_missing_required_document"
    attacks: "Missing required eligibility document"
    expected: "review"
  - id: "03_inconsistent_case_record"
    attacks: "Inconsistent case record"
    expected: "review"
  - id: "04_unauthorized_auto_denial"
    attacks: "Unauthorized automated adverse determination"
    expected: "suppress"
  - id: "05_review_required_due_process"
    attacks: "Due-process review required"
    expected: "due_process_review"
  - id: "06_authorized_reviewed_determination_effect"
    attacks: "Authorized reviewed determination with due-process context"
    expected: "commit"
public_boundaries:
  - "synthetic local inputs only"
  - "no real downstream execution"
  - "not production deployment"
  - "not legal, audit, compliance, privacy, or certification advice"
  - "not a disclosure of private Maxwell implementation details"
