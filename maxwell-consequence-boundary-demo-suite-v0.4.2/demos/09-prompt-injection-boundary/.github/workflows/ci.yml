name: Maxwell Prompt Injection Boundary Demo CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Run demo
        run: make demo
      - name: Verify artifacts
        run: make verify
      - name: Test
        run: make test
      - name: Package hygiene check
        run: make package-check

      - name: Run adversarial corpus
        run: make adversarial
