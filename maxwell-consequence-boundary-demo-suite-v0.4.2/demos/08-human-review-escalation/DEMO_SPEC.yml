schema_version: "maxwell-demo-spec-v0.3.2"
suite_index: "08"
suite_name: "Maxwell Consequence Boundary Demo Suite"
demo_name: "Maxwell Human Review / Escalation Demo"
package_name: "maxwell-human-review-escalation-demo"
version: "0.1.0"
python_package: "maxwell_human_review_escalation"
threat_class: "Human review / escalation authority"
headline: "Review is not a shortcut."
cold_open: "A held AI action reaches a human reviewer. Maxwell still checks whether the reviewer has authority, whether new evidence is sufficient, and whether the reviewer stayed inside the original scope before any authorized effect is created."
core_invariant: "No valid review evidence + reviewer authority -> no authorized effect record."
consequence_boundary: "Held AI action to authorized effect after review"
primary_effect_artifact: "authorized_effect_record.json"
primary_no_effect_marker: "NO_AUTHORIZED_EFFECT_CREATED.txt"
what_this_stresses: "Review evidence, reviewer authority, scope continuity, failed review, and review attempts that expand the original task."
audience:
  - "enterprise operations"
  - "workflow owners"
  - "compliance teams"
  - "regulated teams"
  - "human-in-the-loop reviewers"
standard_commands:
  - "make demo"
  - "make verify"
  - "make test"
  - "make package-check"
cases:
  - id: "01_hold_missing_evidence"
    attacks: "Initial hold because evidence is missing"
    expected: "review"
  - id: "02_reviewer_adds_evidence"
    attacks: "Reviewer adds evidence and has authority"
    expected: "commit_after_review"
  - id: "03_reviewer_lacks_authority"
    attacks: "Reviewer lacks required authority"
    expected: "suppress"
  - id: "04_authorized_reviewer_approves"
    attacks: "Authorized reviewer approves within scope"
    expected: "commit_after_review"
  - id: "05_review_fails_blocked"
    attacks: "Review fails due to untrusted authority/prompt issue"
    expected: "suppress"
  - id: "06_review_attempts_scope_expansion"
    attacks: "Reviewer attempts to expand scope"
    expected: "suppress"
public_boundaries:
  - "synthetic local inputs only"
  - "no real downstream execution"
  - "not production deployment"
  - "not legal, audit, compliance, privacy, or certification advice"
  - "not a disclosure of private Maxwell implementation details"
