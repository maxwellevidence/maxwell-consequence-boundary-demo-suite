name: Maxwell Human Review Escalation Demo CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install demo
        run: pip install -e ".[dev]"
      - name: Lint by compilation
        run: make lint
      - name: Run demo
        run: make demo
      - name: Verify artifacts
        run: make verify
      - name: Run adversarial corpus
        run: make adversarial
      - name: Run tests
        run: make test
      - name: Package hygiene
        run: make package-check
