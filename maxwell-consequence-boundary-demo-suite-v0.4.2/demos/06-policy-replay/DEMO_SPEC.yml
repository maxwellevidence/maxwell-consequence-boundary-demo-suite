schema_version: "maxwell-demo-spec-v0.3.2"
suite_index: "06"
suite_name: "Maxwell Consequence Boundary Demo Suite"
demo_name: "Maxwell Policy Replay Demo"
package_name: "maxwell-policy-replay-demo"
version: "0.1.0"
python_package: "maxwell_policy_replay"
threat_class: "Policy drift / replay without retroactive mutation"
headline: "Same evidence. New policy. No retroactive effect mutation."
cold_open: "A policy changes after an AI-assisted action was evaluated. Maxwell can replay the same evidence under the newer policy, show the drift, and still preserve the original effect decision as governed by the policy that existed at the time."
core_invariant: "Original effect records are governed by the policy-at-the-time; replay may detect drift, but it does not mutate the original effect."
consequence_boundary: "Policy-at-the-time effect record to later policy replay report"
primary_effect_artifact: "effect_record.json"
primary_no_effect_marker: "NO_EFFECT_CREATED.txt"
what_this_stresses: "Policy versioning, threshold changes, authority rule changes, replay difference detection, and non-retroactive effect records."
audience:
  - "compliance"
  - "regulated enterprise"
  - "audit"
  - "governance architects"
  - "risk teams"
standard_commands:
  - "make demo"
  - "make verify"
  - "make replay"
  - "make test"
  - "make package-check"
cases:
  - id: "01_allowed_under_policy_v1"
    attacks: "Baseline action allowed under original policy"
    expected: "allow"
  - id: "02_same_evidence_policy_v2_requires_review"
    attacks: "Same evidence would require review under new policy"
    expected: "allow_then_replay_drift"
  - id: "03_threshold_changed"
    attacks: "Threshold changed after original decision"
    expected: "allow_then_replay_drift"
  - id: "04_authority_rule_changed"
    attacks: "Authority rule changed after original decision"
    expected: "allow_then_replay_drift"
  - id: "05_blocked_under_both_scope_violation"
    attacks: "Scope violation blocked under both policies"
    expected: "block"
  - id: "06_current_policy_would_allow_but_no_retroactive_effect"
    attacks: "New policy would allow, but original block is not mutated"
    expected: "block_then_replay_no_mutation"
public_boundaries:
  - "synthetic local inputs only"
  - "no real downstream execution"
  - "not production deployment"
  - "not legal, audit, compliance, privacy, or certification advice"
  - "not a disclosure of private Maxwell implementation details"
